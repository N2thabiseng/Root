         <h1>Mel Wear Enquiry</h1>

    <p>
        Please complete the form below if you would like more information
        about our products or services.
    </p>

    <form>



        <h2>Customer Details</h2>

        <label for="fullname">Full Name:</label>
        <br>
        <input type="text" id="fullname" name="fullname" required>

        <br><br>

        <label for="email">Email Address:</label>
        <br>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="phone">Phone Number:</label>
        <br>
        <input type="tel" id="phone" name="phone" required>

        <br><br>

        <!-- Enquiry Type -->

        <label for="enquiry">Type of Enquiry:</label>
        <br>

        <select id="enquiry" name="enquiry" required>

            <option value="">-- Select Enquiry Type --</option>

            <option value="product">
                Product Information
            </option>

            <option value="price">
                Price Enquiry
            </option>

            <option value="availability">
                Product Availability
            </option>

            <option value="custom">
                Custom Order
            </option>

            <option value="delivery">
                Delivery Information
            </option>

            <option value="other">
                Other
            </option>

        </select>

        <br><br>

        

        <label for="product">Select Product:</label>
        <br>

        <select id="product" name="product">

            <option value="">-- Select Product --</option>

            <option value="tshirt">T-Shirt</option>

            <option value="hoodie">Hoodie</option>

            <option value="tracksuit">Tracksuit</option>

            <option value="cap">Cap</option>

        </select>

        <br><br>

     

        <label for="size">Select Size:</label>
        <br>

        <select id="size" name="size">

            <option value="">-- Select Size --</option>

            <option value="small">Small</option>

            <option value="medium">Medium</option>

            <option value="large">Large</option>

            <option value="xl">XL</option>

            <option value="xxl">XXL</option>

            <option value="not-applicable">Not Applicable</option>

        </select>

        <br><br>

        <!-- Customer Message -->

        <label for="message">Your Enquiry:</label>
        <br>

        <textarea
            id="message"
            name="message"
            rows="6"
            cols="40"
            placeholder="Enter your enquiry here..."
            required>
        </textarea>

        <br><br>

        <!-- Preferred Contact Method -->

        <h2>Preferred Contact Method</h2>

        <input type="radio" id="emailcontact" name="contact" value="email">
        <label for="emailcontact">Email</label>

        <br>

        <input type="radio" id="phonecontact" name="contact" value="phone">
        <label for="phonecontact">Phone</label>

        <br>

        <input type="radio" id="whatsappcontact" name="contact" value="whatsapp">
        <label for="whatsappcontact">WhatsApp</label>

        <br><br>

        <!-- Submit -->

        <input type="submit" value="Submit Enquiry">

        <input type="reset" value="Clear Form">

    </form>

</body>

</html>
